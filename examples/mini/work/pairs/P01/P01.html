</style></head><body><h1>P01 — Target text</h1><p>Thành phố đã mở một nơi trú ẩn mới vào thứ Hai.<br>
<span class="tie" style="background-color:#FFFF00;color:#000000" title="Reference (R/demonstrative) | level: LC | dir: A | ante: S001: nơi trú ẩn | conf=high | note: danh ngữ demonstrative hồi quy">Nơi này<sup>A</sup></span> có bốn mươi giường.<br>
<span class="tie" style="background-color:#FF9900;color:#000000" title="Conjunction (C/adversative) | level: LC | ante: S002: bốn mươi giường | conf=high | note: nối tương phản liên câu">Nhưng</span> nhu cầu đã cao.<br>
Các quan chức cho biết <span class="tie" style="background-color:#FFFF00;color:#000000" title="Reference (R/personal) | level: TC | dir: A | ante: S004: Các quan chức (trong câu) | conf=high | note: [TC] họ ← Các quan chức trong cùng câu">họ<sup>A</sup></span> sẽ bổ sung thêm<span class="tie" style="background-color:#0000FF;color:#FFFFFF" title="Ellipsis (E/nominal) | level: LC | ante: S002: bốn mươi giường | conf=high | note: [LC] lược {giường} sau “bổ sung thêm”">∅</span>.<br>
Một <span class="tie" style="background-color:#9900FF;color:#FFFFFF" title="Lexical cohesion (L/repetition) | level: LC | ante: S001: nơi trú ẩn | conf=med | note: lặp danh từ chung">nơi</span> đã chật kín.</p></body></html>
